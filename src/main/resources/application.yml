spring:
  application:
    name: kotlin-grpc-rest-starter
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:starter}
    username: ${DB_USER:starter}
    password: ${DB_PASS:starter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9090
  shell:
    interactive:
      enabled: false

standard-tools:
  market-data:
    default-provider: yfinance
    cache-ttl: 1h
    providers:
      yfinance:
        enabled: true
      polygon:
        enabled: false
      bloomberg:
        enabled: false

server:
  port: 8080
