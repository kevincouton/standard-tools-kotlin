spring:
  application:
    name: standard-tools-kotlin
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:starter}
    username: ${DB_USER:starter}
    password: ${DB_PASS:starter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9090
  shell:
    interactive:
      enabled: false

standard-tools:
  security:
    auth-enabled: ${SQT_AUTH_ENABLED:true}
    api-key: ${SQT_API_KEY:}
  market-data:
    default-provider: yfinance
    cache-ttl: 1h
    providers:
      yfinance:
        enabled: true
      polygon:
        enabled: false
      bloomberg:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
