name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up tools with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run unit tests
        id: unit-tests
        run: ./gradlew test

      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          retention-days: 14
          path: |
            build/reports/tests/test/
            build/test-results/test/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up tools with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run integration tests
        id: integration-tests
        run: ./gradlew integrationTest

      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          retention-days: 14
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up tools with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run E2E tests
        id: e2e-tests
        run: ./gradlew e2eTest

      - name: Upload E2E test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-reports
          retention-days: 14
          path: |
            build/reports/tests/e2eTest/
            build/test-results/e2eTest/

  build-jvm:
    runs-on: ubuntu-latest
    needs: e2e-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up tools with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build JVM bootJar
        run: ./gradlew bootJar

      - name: Upload JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: jvm-boot-jar
          retention-days: 14
          path: build/libs/*.jar

  smoke-tests:
    runs-on: ubuntu-latest
    needs: build-jvm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up tools with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Build JVM container image
        run: podman build -t standard-tools-kotlin:${{ github.sha }} .

      - name: Smoke test JVM container image
        id: smoke-test
        run: |
          podman network create starter-net || true
          podman run -d --name starter-postgres --network starter-net \
            -e POSTGRES_DB=starter -e POSTGRES_USER=starter -e POSTGRES_PASSWORD=starter \
            postgres:18
          for i in {1..30}; do
            if podman exec starter-postgres pg_isready -U starter -d starter; then
              echo "Postgres is ready"
              break
            fi
            sleep 2
          done
          if ! podman exec starter-postgres pg_isready -U starter -d starter; then
            echo "Postgres did not become ready" >&2
            podman logs starter-postgres
            exit 1
          fi
          podman run -d --name starter-smoke --network starter-net \
            -p 8080:8080 -p 9090:9090 \
            -e DB_HOST=starter-postgres -e DB_PORT=5432 -e DB_NAME=starter \
            -e DB_USER=starter -e DB_PASS=starter \
            standard-tools-kotlin:${{ github.sha }}
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed" >&2
          podman logs starter-postgres
          podman logs starter-smoke
          exit 1

      - name: Clean up smoke test containers
        if: always()
        run: |
          podman stop starter-smoke starter-postgres || true
          podman rm starter-smoke starter-postgres || true
          podman network rm starter-net || true

  build-native:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build native executable
        run: ./gradlew nativeCompile

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: native-executable
          retention-days: 14
          path: build/native/nativeCompile/standard-tools-kotlin

  ci-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, build-jvm, build-native, smoke-tests]
    if: always()
    steps:
      - name: Job summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JVM build | ${{ needs.build-jvm.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native build | ${{ needs.build-native.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke tests | ${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- JVM image: standard-tools-kotlin:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reproduce locally: scripts/run-act-local.sh" >> $GITHUB_STEP_SUMMARY
